<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>OUPV/Six Pack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: chart-table app. Sticky header with nav, single centered column of cards; bottom tab bar on phones. */
:root{
  --paper:#F2F6F8; --surface:#FFFFFF; --surface-2:#E8EFF3; --ink:#0F2433; --muted:#566977; --line:#D3DEE5;
  --water:#D6E8F1; --land:#EADDB9; --accent:#D2470F; --accent-soft:#FBE3D6; --on-accent:#FFFFFF;
  --good:#17784A; --good-soft:#DDF2E6; --bad:#B8322A; --bad-soft:#F9E0DD;
  --port:#D02B2B; --stbd:#11884A; --chart:#1F5D86;
  --m100:#C2410C; --m170:#A16207; --m171:#0F7A5A; --m172:#1D5F8C;
  --display:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0A141C; --surface:#11202B; --surface-2:#172B38; --ink:#E3ECF1; --muted:#93A7B4; --line:#24394A;
  --water:#123247; --land:#3A3425; --accent:#FF7A3D; --accent-soft:#3A1E10; --on-accent:#1A0B03;
  --good:#4CC98A; --good-soft:#0F3122; --bad:#FF7A70; --bad-soft:#3B1613;
  --port:#FF5A55; --stbd:#3FD08A; --chart:#6CB4E4;
  --m100:#FF8A50; --m170:#E8B34A; --m171:#45C99B; --m172:#6CB4E4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0A141C; --surface:#11202B; --surface-2:#172B38; --ink:#E3ECF1; --muted:#93A7B4; --line:#24394A;
  --water:#123247; --land:#3A3425; --accent:#FF7A3D; --accent-soft:#3A1E10; --on-accent:#1A0B03;
  --good:#4CC98A; --good-soft:#0F3122; --bad:#FF7A70; --bad-soft:#3B1613;
  --port:#FF5A55; --stbd:#3FD08A; --chart:#6CB4E4;
  --m100:#FF8A50; --m170:#E8B34A; --m171:#45C99B; --m172:#6CB4E4; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2rem,5vw,2.8rem)} h2{font-size:1.75rem} h3{font-size:1.3rem}
p{margin:0}
a{color:var(--chart)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:20px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-size:1.35rem;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:8px;font-size:.95rem}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surface-2)}
.nav a svg{width:18px;height:18px}
.tabbar{display:none}
@media (max-width:720px){
  .nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
  .tabbar a.on{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}

main{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.mod{color:#fff}
.mQ100{--mc:var(--m100)} .mQ170{--mc:var(--m170)} .mQ171{--mc:var(--m171)} .mQ172{--mc:var(--m172)}
.chip.mod{background:var(--mc)}
:root:not([data-theme="light"]) .chip.mod{color:var(--paper)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .chip.mod{color:#fff}}
:root[data-theme="light"] .chip.mod{color:#fff}

.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;min-height:38px}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;overflow:hidden;position:relative}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:10px}
.hero .actions{margin-top:20px}
.hero-art{width:100%;max-width:360px;justify-self:center}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:20px}.hero-art{max-width:260px;order:-1}}

/* module cards */
.modcard{display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--mc)}
.modcard .code{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--mc);line-height:1}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:var(--mc,var(--accent));border-radius:99px;transition:width .4s}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted)}
.kv b{color:var(--ink);font-family:var(--mono);font-weight:500}

/* lessons */
.lesson-card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border-left:4px solid var(--mc);transition:transform .15s,border-color .15s}
.lesson-card:hover{transform:translateY(-2px)}
.lesson-card h3{font-size:1.2rem}
.lesson-card p{font-size:.93rem;color:var(--muted)}
.lesson-card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.added{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--chart);border:1px solid currentColor;padding:1px 6px;border-radius:4px}
.lesson-head{display:flex;flex-direction:column;gap:10px}
.lesson-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.lesson-body{grid-template-columns:1fr}}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto;min-width:300px}
.core{background:var(--accent-soft);border-radius:var(--radius);padding:16px 18px}
.core .eyebrow{color:var(--accent)}
.points{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px}
.points li{padding-left:2px}
.points li::marker{color:var(--accent)}
.mnemo{font-family:var(--display);font-size:1.15rem;font-weight:600;letter-spacing:.02em}

/* quiz */
.quiz{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtop .count{font-family:var(--mono);font-size:.9rem;color:var(--muted);margin-left:auto}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qcard{display:flex;flex-direction:column;gap:18px}
.stem{font-size:1.25rem;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:10px;cursor:pointer;font-size:1.02rem;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;background:var(--surface-2);color:var(--muted)}
.opt.sel{border-color:var(--ink);background:var(--surface-2)}
.opt.sel .k{background:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.feedback{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--display);font-size:1.2rem;letter-spacing:.02em}
.feedback.ok b{color:var(--good)} .feedback.no b{color:var(--bad)}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.navgrid button{height:38px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:.8rem;cursor:pointer}
.navgrid button.done{background:var(--surface-2);border-color:var(--muted)}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--accent)}
.navgrid button.r{background:var(--good-soft);border-color:var(--good)}
.navgrid button.w{background:var(--bad-soft);border-color:var(--bad)}
.visual{border-radius:10px;overflow:hidden;background:var(--surface-2)}
.visual svg{display:block;width:100%;height:auto;max-height:340px}
.visual .btn svg{width:18px;height:18px;display:inline}
.confirm{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px 16px}

/* results */
.score{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none}
.verdict{font-family:var(--display);font-size:2rem;font-weight:700}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.missed{display:flex;flex-direction:column;gap:10px}
.missed .item{border-left:3px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.92rem}
.bar-row .meter{height:10px}

/* drills */
.drill{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;padding:0;overflow:hidden;cursor:pointer;text-align:left}
.drill .art{background:var(--surface-2);aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;overflow:hidden}
.drill .art svg{width:100%;height:100%;display:block}
.drill .txt{padding:0 18px 18px;display:flex;flex-direction:column;gap:6px}
.drill:hover h3{color:var(--accent)}

/* widgets */
.widget{display:flex;flex-direction:column;gap:14px}
.ctrl{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:.95rem}
.ctrl label{font-weight:600}
.ctrl output{font-family:var(--mono);text-align:right;font-size:.95rem}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
input[type=number],input[type=time]{font:inherit;font-family:var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-height:42px}
.readout{font-family:var(--mono);font-size:1.05rem;background:var(--surface-2);border-radius:8px;padding:12px 14px;line-height:1.7;overflow-x:auto}
.readout b{color:var(--accent);font-weight:500}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--mono)}
.chain .box{border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);text-align:center;min-width:64px}
.chain .box small{display:block;font-family:var(--body);font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chain .box.hi{border-color:var(--accent)}
.chain .op{color:var(--muted);font-size:.85rem}
.sig-list{display:flex;flex-direction:column;gap:8px}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left}
.sig:hover{border-color:var(--muted)}
.pattern{display:flex;gap:5px;align-items:center;min-width:92px}
.pattern i{display:block;height:10px;border-radius:5px;background:var(--ink);opacity:.85;transition:background .1s}
.pattern i.s{width:12px}.pattern i.p{width:40px}.pattern i.r{width:9px}
.pattern i.on{background:var(--accent);opacity:1}
.bigpattern{display:flex;gap:10px;align-items:center;justify-content:center;padding:26px 16px;flex-wrap:wrap}
.bigpattern i{height:18px;border-radius:9px;background:var(--ink);display:block;opacity:.85}
.bigpattern i.s{width:24px}.bigpattern i.p{width:84px}.bigpattern i.r{width:18px}
.bigpattern i.on{background:var(--accent);opacity:1}
.foot-note{font-size:.85rem;color:var(--muted);max-width:75ch}
.scene{display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (hover:none){.kbd-hint{display:none}}
.kbd{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* svg classes */
.s-water{fill:var(--water)} .s-land{fill:var(--land)} .s-ink{fill:var(--ink)} .s-muted{fill:var(--muted)} .s-surface{fill:var(--surface)}
.s-acc{fill:var(--accent)} .s-port{fill:var(--port)} .s-stbd{fill:var(--stbd)} .s-chart{fill:var(--chart)} .s-good{fill:var(--good)}
.l-ink{stroke:var(--ink);fill:none} .l-muted{stroke:var(--muted);fill:none} .l-acc{stroke:var(--accent);fill:none} .l-chart{stroke:var(--chart);fill:none} .l-line{stroke:var(--line);fill:none}
svg text{font-family:var(--body);fill:var(--ink)}
svg .t-lab{font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:12px}
svg .t-mono{font-family:var(--mono);font-size:11px}
svg .t-small{font-size:11px;fill:var(--muted)}
svg .t-acc{fill:var(--accent)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--ink)"/></marker>
    <marker id="ah-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--accent)"/></marker>
    <marker id="ah-chart" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--chart)"/></marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--muted)"/></marker>
    <marker id="ah-good" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" style="fill:var(--good)"/></marker>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030810"/><stop offset="1" stop-color="#0c1f30"/></linearGradient>
    <linearGradient id="daysky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bcd9ea"/><stop offset="1" stop-color="#e9f3f8"/></linearGradient>
  </defs>
</svg>

<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="OUPV/Six Pack home">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" style="fill:var(--ink)"/><circle cx="20" cy="20" r="12.5" fill="none" style="stroke:var(--paper)" stroke-width="1.2"/><path d="M20 4 L23 20 L20 36 L17 20Z" style="fill:var(--paper)"/><path d="M20 4 L23 20 L17 20Z" style="fill:var(--accent)"/><path d="M4 20 L20 17.5 L36 20 L20 22.5Z" style="fill:var(--paper)" opacity=".55"/></svg>
    <span><b>OUPV/Six Pack</b><small>Near Coastal exam prep</small></span>
  </a>
  <nav class="nav" id="nav"></nav>
</div></header>

function lightsSVG(key, view) {

  const side = view === "port" || view === "stbd";
  const pos = view === "port" ? x => 72 + x * 176 : view === "stbd" ? x => 248 - x * 176 : () => 160;
  let s = `<svg viewBox="0 0 ${W} 190" class="scene" role="img" aria-label="Night scene: a vessel seen ${VIEWN[view]}"><rect width="${W}" height="190" fill="url(#nightsky)"/>`;

  if (side) {

    s += `<polygon points="${p(0, WL - 13)} ${p(1, WL - 9)} ${p(1, WL)} ${p(.07, WL)}" fill="${hull}" stroke="${hullEdge}"/>`;
    s += `<polygon points="${p(.3, WL - 13)} ${p(.62, WL - 11)} ${p(.62, WL - 22)} ${p(.34, WL - 24)}" fill="${hull}" stroke="${hullEdge}"/>`;

    s += `<polygon points="134,${WL - 13} 186,${WL - 13} 174,${WL} 146,${WL}" fill="${hull}" stroke="${hullEdge}"/><rect x="146" y="${WL - 24}" width="28" height="11" fill="${hull}" stroke="${hullEdge}"/>`;
    if (maxH) s += `<line x1="160" x2="160" y1="${WL - 12}" y2="${WL - maxH - 4}" stroke="${hullEdge}" stroke-width="2"/>`;
    if (v.sail) s += `<line x1="160" x2="160" y1="${WL - 12}" y2="${WL - 118}" stroke="${hullEdge}" stroke-width="2"/>`;

    s += `<rect x="138" y="${WL - 13}" width="44" height="13" fill="${hull}" stroke="${hullEdge}"/><rect x="148" y="${WL - 24}" width="24" height="11" fill="${hull}" stroke="${hullEdge}"/>`;
    if (maxH) s += `<line x1="160" x2="160" y1="${WL - 12}" y2="${WL - maxH - 4}" stroke="${hullEdge}" stroke-width="2"/>`;
  }

    if (L.t === "mast" && view !== "astern") dots.push([pos(L.x), L.h, "w"]);

  { id: "signals", mod: "Q100", title: "Sound signals and restricted visibility", core: "Short blast ≈ 1 second, prolonged blast 4–6 seconds. Maneuvering signals are for vessels in sight; fog signals (Rule 35) are for restricted visibility.", widget: "signals",
    points: ["International, in sight: 1 short = altering to starboard; 2 short = altering to port; 3 short = operating astern propulsion.", "Inland: 1 short and 2 short state an intention (\"I intend to leave you on my port / starboard side\") and are answered with the same signal to agree.", "Danger or doubt: at least five short and rapid blasts. Approaching a blind bend: one prolonged blast, answered by one prolonged.", "In restricted visibility, at intervals of not more than 2 minutes: power making way — one prolonged; underway but stopped — two prolonged; sailing, fishing, towing, NUC, RAM, constrained — one prolonged + two short; manned tow — one prolonged + three short.", "At anchor: ring the bell rapidly for about 5 seconds every minute. Aground: three separate strokes, rapid ringing, then three strokes.", "Rule 19 (not in sight of one another): there is no stand-on vessel. Avoid altering to port for a vessel forward of the beam (unless overtaking it), and avoid turning toward a vessel abeam or abaft the beam. Hear a fog signal forward of the beam? Slow to bare steerageway."],
    mnemo: "Tap a signal below to hear it." },
  { id: "anchoring", mod: "Q170", title: "Anchoring and scope", core: "Scope is total rode length divided by the vertical distance from the bow roller to the seabed. The right scope depends on gear, holding ground, depth, conditions and swinging room.", widget: "anchoring",
    points: ["Use depth at high water plus bow height, not charted depth alone.", "Common rules of thumb: about 7:1 for rope rode in normal conditions, 5:1 in a crowded, settled anchorage, more as wind and sea build. All-chain rode can hold at shorter scope.", "Pick good holding (sand or mud), enough room to swing with every boat around you, and protection from the forecast wind.", "Set the anchor with gentle sternway, then confirm it's holding with fixed bearings or a GPS anchor alarm.", "Watch for dragging: bearings that change, or a GPS track that drifts away from your swing circle.", "Use a snubber and chafe protection. Show an anchor light at night and a black ball by day."],
    mnemo: "10 ft depth + 4 ft bow = 14 ft × 7 = 98 ft of rode." },
  { id: "fire", mod: "Q170", title: "Fire prevention and response", core: "Fire needs heat, fuel, oxygen and a chain reaction. Remove one and it stops. Raise the alarm, protect people, isolate fuel and power when safe, then fight it with the right extinguisher.",
    points: ["Class A: ordinary combustibles (wood, paper, cloth). Class B: flammable liquids (fuel, oil). Class C: energized electrical. Class D: combustible metals. Class K: cooking oils and fats.", "First priorities: sound the alarm, account for everyone, shut off fuel and electrical sources if safe, close off the space to starve it of air.", "Use an extinguisher approved for the hazard. Technique: Pull the pin, Aim at the base, Squeeze, Sweep (PASS).", "Gasoline vapor is heavier than air and settles in bilges. Run the blower at least 4 minutes before starting a gasoline inboard, and never start if you smell fuel.", "Batteries release flammable hydrogen while charging: ventilate and avoid sparks.", "Prepare to abandon ship if the fire can't be controlled: PFDs on, distress call made, liferaft or dinghy ready."],
    mnemo: "PASS: Pull · Aim · Squeeze · Sweep." },
  { id: "mob", mod: "Q170", title: "Person overboard and distress calls", core: "Raise the alarm, keep the person in sight, throw flotation and mark the spot, then maneuver back under control and recover safely. Tailor the method to wind, sea and your boat.",
    points: ["Shout \"Man overboard!\" and the side. Assign someone to point at the person continuously. Throw a ring or cushion and press the GPS MOB button.", "Williamson turn: hard over toward the person's side, at 60° off course go hard over the other way, and come to the reciprocal course. Good at night or in poor visibility. If the person is in sight, a quick single turn may be faster.", "Approach from downwind, stop the propeller near the person and keep the prop away from them. Treat for hypothermia: handle gently, keep the casualty horizontal.", "MAYDAY = grave and imminent danger. PAN-PAN = urgency without immediate danger. SÉCURITÉ = safety message (navigation, weather).", "Call on VHF channel 16 (156.8 MHz) or press the DSC distress button (channel 70). Give: MAYDAY ×3, vessel name ×3, position, nature of distress, help needed, number aboard, vessel description.", "A 406 MHz EPIRB sends a distress alert and position when activated; it supplements the radio call. Brief passengers on PFDs, emergency signals and where to go."],
    mnemo: "MAYDAY · position · nature · help needed · persons aboard." },
  { id: "lines", mod: "Q170", title: "Line handling and docking", core: "Keep out of line bights and snap-back zones and never put a hand or foot between the boat and the dock. Brief the crew, account for wind and current, and have an abort plan.",
    points: ["Bowline: a fixed loop that won't slip. Cleat hitch: secures a line to a cleat. Clove hitch: quick, temporary. Round turn and two half hitches: around a piling or rail. Sheet bend: joins two lines. Figure-eight: stopper knot.", "Line terms: bitter end (the very end), standing part (the inactive part), bight (a loop or curve), working end (the part used to tie).", "Dock lines: bow line, stern line, and spring lines that stop the boat moving forward and aft.", "Approach slowly, into the wind or current where possible. Use the least power that keeps control.", "Prop walk: a right-hand propeller walks the stern to port in reverse. The pivot point moves as the boat moves.", "Protect lines from chafe where they cross the rail or a chock."],
    mnemo: "Slow is pro: never approach faster than you want to hit the dock." },
  { id: "systems", mod: "Q170", added: true, title: "Engines and electrical", core: "Most engine trouble afloat is cooling, fuel or electrical. A pre-start check and attention to gauges stop small faults from becoming emergencies.",
    points: ["Before starting: bilge (water, fuel smell), oil and coolant levels, belts, raw-water seacock open and strainer clear, steering, battery state. Gasoline: blower 4 minutes.", "Diesel = compression ignition. Gasoline = spark ignition.", "Overheating: check for a closed seacock, clogged strainer, failed impeller, loose belt or bad thermostat. Little or no water from the exhaust is an early warning.", "Low oil pressure: reduce load or shut down promptly, then diagnose. Never rev the engine to \"force\" pressure up.", "Power: P = V × I (watts = volts × amps). Fuses and breakers protect wiring from overcurrent.", "Enclosed spaces can hold fumes or lack oxygen: ventilate and have a rescue plan before entering."],
    mnemo: "Water out the exhaust = cooling water flowing." },
  { id: "stability", mod: "Q170", added: true, title: "Stability, weather handling and rules", core: "Keep weight low and secured, avoid free surface, keep openings closed, and manage heavy weather early. Know what your credential and vessel allow.",
    points: ["G = center of gravity, B = center of buoyancy, M = metacenter. The righting arm GZ brings the boat back upright.", "Weight added high raises G and reduces stability. Passengers crowding to one side do the same.", "Free-surface effect: liquid sloshing in a partly full tank or flooded bilge reduces stability.", "Heavy weather: check the forecast, reduce speed early, secure gear, close hatches, take seas at an angle and avoid broaching in following seas.", "OUPV (six-pack): up to six passengers for hire on an uninspected vessel. Know your route, tonnage and credential limits.", "No oil discharge (report spills to the National Response Center) and no plastic overboard anywhere. Use the Coast Pilot and current charts for passage planning."],
    mnemo: "Low and tight: weight low, gear tied, tanks full or empty." },
  { id: "compass", mod: "Q171", title: "True, magnetic and compass", core: "Variation (from the chart's compass rose) and deviation (from your boat's deviation card) convert between true, magnetic and compass headings. Easterly errors are added going from compass to true.", widget: "compass",
    points: ["Variation: the angle between true north and magnetic north. It depends on location and year and is printed on the compass rose.", "Deviation: the error caused by your own vessel's magnetism. It changes with heading and comes from the deviation card.", "Going up from Compass to True: add East, subtract West. Going down from True to Compass: add West, subtract East.", "Worked: compass 087°, deviation 2°W, variation 12°E → magnetic 085° → true 097°.", "Reverse: true 252°, variation 11°E, deviation 2°W → magnetic 241° → compass 243°.", "A reciprocal bearing is ±180°: a bearing of 045° from you to a light is 225° from the light to you."],
    mnemo: "True Virgins Make Dull Companions (Add Whiskey)." },
  { id: "buoys", mod: "Q171", title: "U.S. aids to navigation", core: "In U.S. waters (IALA Region B), red marks are kept on your starboard side when returning from sea. Shape, color, number and light all tell you what a mark means.", widget: "buoys",
    points: ["Red nuns: even numbers, red lights, on your starboard side returning. Green cans: odd numbers, green lights, on your port side. Numbers increase from seaward.", "Preferred-channel (junction) marks: the color of the top band tells you how to treat the mark. Red on top means the preferred channel is to port.", "Safe-water mark: red and white vertical stripes, red ball topmark, Morse A white light. Navigable water all around.", "Isolated-danger mark: black with red bands, two black ball topmarks, Fl(2) white light. Danger directly under it, safe water around.", "Special marks are yellow. Information and regulatory marks are white with orange shapes: diamond = danger, diamond with cross = keep out, circle = controlled area, square = information.", "Light abbreviations: F fixed, Fl flashing, Q quick, Iso equal light and dark, Oc occulting (more light than dark), Mo(A) Morse A. Fl(2) 10s = group of two flashes every 10 seconds."],
    mnemo: "Red, Right, Returning." },
  { id: "tides", mod: "Q171", title: "Tides and water depth", core: "Depth of water ≈ charted depth + height of tide. Subtract your draft to get static clearance, then leave margin for squat, waves, heel and chart error.", widget: "tides",
    points: ["U.S. chart soundings refer to Mean Lower Low Water (MLLW). A negative tide means less water than charted.", "Check the units in the chart title: feet, fathoms or meters.", "Semidiurnal: two highs and two lows each lunar day (about 24 h 50 min). Diurnal: one of each. Mixed: two of each at unequal heights.", "Spring tides (bigger range) come near new and full moon. Neap tides (smaller range) come near the first and third quarter.", "Rule of Twelfths: in each hour of a ~6-hour tide, the water moves 1, 2, 3, 3, 2, 1 twelfths of the range.", "Tidal current tables give the time, direction and rate of the current; a tide table gives heights."],
    mnemo: "Depth = charted + tide. Clearance = depth − draft." },
  { id: "weather", mod: "Q171", title: "Marine weather", core: "Read pressure tendency, wind shifts, cloud and visibility together, check official forecasts, and have a plan B for fog, squalls and thunderstorms.",
    points: ["A falling barometer points to an approaching low and worsening weather; a rapid fall means strong wind is coming.", "Cold front: sharp wind shift, squalls and showers, then clearing and cooler air. Warm front: lowering clouds, steady rain, poor visibility.", "Advection fog: warm, moist air moving over colder water (common at sea). Radiation fog: clear, calm nights cooling the land; it can drift into harbors.", "Sea breeze: land heats by day and draws an onshore breeze in the afternoon.", "Thunderstorms bring lightning, gust fronts, sudden wind shifts and poor visibility. Watch radar and NOAA Weather Radio.", "Buys Ballot's law (Northern Hemisphere): stand with your back to the wind and low pressure is on your left."],
    mnemo: "Falling glass, coming blast." },
  { id: "charts", mod: "Q171", added: true, title: "Charts, publications and electronics", core: "Measure distance on the latitude scale, read the chart's title block for datum and units, keep publications current, and treat GPS, radar and AIS as aids, not guarantees.",
    points: ["One minute of latitude = one nautical mile. Measure on the latitude scale at the same latitude as your course. Never use the longitude scale.", "The title block lists chart datum, sounding units and horizontal datum. A GPS set to a different datum can put you off by a noticeable distance.", "Compass rose: outer ring true, inner ring magnetic, with variation, year and annual change.", "Coast Pilot: narrative local information. Light List: lights and aids. Local Notice to Mariners: corrections. Tide and tidal current tables.", "Radar can miss small targets in sea clutter or rain. Many small boats don't transmit AIS. Keep a lookout regardless.", "Danger bearing: a pre-plotted bearing on a landmark that keeps you clear of a hazard."],
    mnemo: "Latitude for length." },
  { id: "lop", mod: "Q172", title: "Lines of position and fixes", core: "A bearing on a charted landmark gives a line of position. Two or more taken at the same time cross at a fix. Plot the reciprocal bearing from the mark.",
    points: ["LOP: you are somewhere along this line. Label time above the line and bearing (three digits) below.", "Fix: two or more simultaneous LOPs. Best angle between two is 90°; with three, about 120°.", "Three LOPs that don't meet form a cocked hat: assume you're at the corner closest to danger.", "Running fix: advance an earlier LOP by the course and distance run to cross it with a later one.", "Order of reliability: fix → running fix → estimated position → DR position.", "Bearings by hand-bearing compass are magnetic: convert to true before plotting on the true rose."],
    mnemo: "Time on top, bearing below." },
  { id: "dr", mod: "Q172", title: "Dead reckoning", core: "From a known position, advance along your true course for the distance run (speed × time) through the water. Compare with real fixes to find the current.",
    points: ["DR uses only ordered course and speed. It ignores current and leeway.", "Plot a DR at least every hour, at every course or speed change, and when you get a single LOP.", "Symbols: fix = circle, DR = semicircle, estimated position = square.", "Label the course line: C (true course, three digits) above, S (speed) below.", "The difference between your DR and an actual fix at the same time shows the set and drift you experienced.", "Six-minute rule: in 6 minutes you travel one tenth of your speed in nautical miles."],
    mnemo: "Known point + course + distance = DR." },
  { id: "current", mod: "Q172", title: "Set and drift", core: "Set is the direction the current flows toward; drift is its speed. Add your vector through the water and the current vector to get your track over the ground.", widget: "current",
    points: ["Set is given in degrees true (direction toward). Drift is in knots. Wind is the opposite: named for where it comes from.", "Heading and speed through the water + set and drift = course and speed over ground (COG and SOG).", "Example: steering 000° at 6 kn with a 2 kn current setting 090° gives COG ≈ 018°T and SOG ≈ 6.32 kn.", "To make good a desired track, solve the current triangle for the course to steer. Pointing \"a bit\" into the current isn't enough.", "Speed made good (SMG) = distance between fixes ÷ time between them."],
    mnemo: "Set = toward. Drift = speed." },
  { id: "eta", mod: "Q172", title: "Time, distance and speed", core: "Distance (nm) = speed (knots) × time (hours). Convert minutes to hours before multiplying.", widget: "eta",
    points: ["Time = distance ÷ speed. Speed = distance ÷ time.", "Minutes to decimal hours: divide by 60. 24 min = 0.4 h; 45 min = 0.75 h.", "\"60 D Street\": 60 × D = S × T when T is in minutes.", "ETA = departure time + running time. 22.5 nm at 7.5 kn = 3 h: depart 0935, arrive 1235.", "Six-minute rule: at 8 kn you cover 0.8 nm in 6 minutes."],
    mnemo: "D = S × T." }
];

/* ---------- DRILL GENERATORS ---------- */
function distinctOpts(correct, cands, fmt) {
  const seen = new Set([fmt(correct)]), out = [fmt(correct)];
  for (const c of cands) { const f = fmt(c); if (!seen.has(f)) { seen.add(f); out.push(f); } if (out.length === 4) break; }
  let k = 1; while (out.length < 4) { const f = fmt(typeof correct === "number" ? correct + k * 3 : correct + k); if (!seen.has(f)) { seen.add(f); out.push(f); } k++; }
  return out;
}
const CALC = [
  () => { const c = rnd(0, 359), d = rnd(1, 6) * pickOne([1, -1]), v = rnd(2, 18) * pickOne([1, -1]), m = norm(c + d), t = norm(m + v);
    return { q: `Compass heading ${deg(c)}, deviation ${ew(d)}, variation ${ew(v)}. What is the true heading?`, o: distinctOpts(t, [c - d + v, c + d - v, c - d - v].map(norm), x => deg(x) + "T"), a: 0, x: `Compass → true: add East, subtract West. ${deg(c)} ${d >= 0 ? "+" : "−"} ${Math.abs(d)} = ${deg(m)} M; ${v >= 0 ? "+" : "−"} ${Math.abs(v)} = ${deg(t)} T.`, lesson: "compass" }; },
  () => { const t = rnd(0, 359), v = rnd(2, 18) * pickOne([1, -1]), d = rnd(1, 6) * pickOne([1, -1]), m = norm(t - v), c = norm(m - d);
    return { q: `True course ${deg(t)}, variation ${ew(v)}, deviation ${ew(d)}. What compass course do you steer?`, o: distinctOpts(c, [t + v + d, t - v + d, t + v - d].map(norm), x => deg(x) + "C"), a: 0, x: `True → compass: add West, subtract East. ${deg(t)} ${v >= 0 ? "−" : "+"} ${Math.abs(v)} = ${deg(m)} M; ${d >= 0 ? "−" : "+"} ${Math.abs(d)} = ${deg(c)} C.`, lesson: "compass" }; },
  () => { const s = pickOne([5, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20]), mins = pickOne([12, 18, 24, 30, 36, 42, 48, 54, 66, 72, 90]), d = s * mins / 60;
    return { q: `At ${s} knots, how far do you travel in ${mins} minutes?`, o: distinctOpts(d, [s * mins / 100, d * 2, s * mins / 6, d + s / 10], x => fmt1(x) + " nm"), a: 0, x: `D = S × T = ${s} × (${mins} ÷ 60) = ${s} × ${fmt1(mins / 60)} h = ${fmt1(d)} nm.`, lesson: "eta" }; },
  () => { const s = pickOne([4, 5, 6, 7.5, 8, 10, 12, 15]), mins = pickOne([60, 90, 120, 150, 180, 210, 240]), d = s * mins / 60, dep = rnd(12, 30) * 30 + pickOne([0, 5, 10, 15, 20]);

function viewQuiz() {
  const s = SESSION, it = s.items[s.i], exam = s.mode === "exam", pick = s.picks[s.i], shown = s.shown[s.i];
  const answered = s.picks.filter(p => p !== null).length;
  const meta = it.id ? `<span class="chip mod m${it.mod}">${it.mod}</span><span class="chip">${it.id}</span>` : `<span class="chip">Drill</span>`;
  const optsHTML = it.order.map((oi, k) => {
    let cls = "opt"; if (pick === oi) cls += " sel";
    if (shown) { if (oi === it.a) cls = "opt right"; else if (pick === oi) cls = "opt wrong"; }
    return `<button class="${cls}" data-act="ans" data-oi="${oi}" ${shown ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(it.o[oi])}</span></button>`;
  }).join("");
  const visual = it.visual ? `<div class="visual" style="background:${it.visual.includes("nightsky") ? "#05111b" : "#cfe3ee"}">${it.visual}</div>` : it.sound ? `<div class="visual"><div class="bigpattern" id="bigpat">${[...it.sound].map(c => `<i class="${c === "-" ? "p" : c === "r" ? "r" : "s"}"></i>`).join("")}</div><div class="row" style="justify-content:center;padding:0 0 18px"><button class="btn" data-act="play">${IC.play} Play signal</button></div></div>` : "";
  const ok = shown && pick === it.a;
  const fb = shown ? `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Correct" : "Correct answer: " + esc(it.o[it.a])}</b><span>${esc(it.x)}</span>${it.lesson && LBYID[it.lesson] ? `<a href="#lesson-${it.lesson}" style="font-weight:600">Review lesson: ${esc(LBYID[it.lesson].title)}</a>` : ""}</div>` : "";
  const last = s.i === s.items.length - 1;
  let nav;
  if (exam) nav = `<div class="qnav"><button class="btn" data-act="prev" ${s.i ? "" : "disabled"}>${IC.back} Previous</button><button class="btn ghost" data-act="flag">${IC.flag} ${s.flags[s.i] ? "Unflag" : "Flag"}</button>${last ? `<button class="btn primary" data-act="submit">Submit exam</button>` : `<button class="btn primary" data-act="next">Next ${IC.arrow}</button>`}</div>`;
  else nav = `<div class="qnav"><button class="btn ghost" data-act="quit">End session</button>${shown ? `<button class="btn primary" data-act="next" id="nextbtn">${last ? "See results" : "Next question"} ${IC.arrow}</button>` : `<span class="muted" style="align-self:center;font-size:.9rem">Pick an answer<span class="kbd-hint"> · keys <span class="kbd">1</span>–<span class="kbd">4</span></span></span>`}</div>`;
  const confirm = exam && s.confirm ? `<div class="confirm stack"><b>Submit now?</b><span>${answered} of ${s.items.length} answered${s.items.length - answered ? `; ${s.items.length - answered} unanswered will count as wrong` : ""}.</span><div class="row"><button class="btn primary" data-act="submit-yes">Submit and score</button><button class="btn" data-act="submit-no">Keep working</button></div></div>` : "";
  const grid = exam ? `<details class="card" ${s.items.length <= 10 ? "open" : ""}><summary style="cursor:pointer;font-weight:600">Question map · ${answered}/${s.items.length} answered</summary><div class="navgrid" style="margin-top:12px">${s.items.map((_, k) => `<button data-act="goto" data-k="${k}" class="${s.picks[k] !== null ? "done" : ""} ${k === s.i ? "cur" : ""} ${s.flags[k] ? "flag" : ""}">${k + 1}</button>`).join("")}</div></details>` : "";
  app.innerHTML = `<div class="quiz"><div class="qtop"><h3>${esc(s.title)}</h3>${exam ? '<span class="chip">Exam mode</span>' : ""}<span class="count">${s.i + 1} / ${s.items.length}</span></div><div class="progress"><i style="width:${100 * (exam ? answered : s.i + (shown ? 1 : 0)) / s.items.length}%"></i></div>
  <div class="card qcard"><div class="row">${meta}</div>${visual}<p class="stem">${esc(it.q)}</p><div class="opts">${optsHTML}</div>${fb}</div>${confirm}${nav}${grid}</div>`;
  if (it.sound && AC && !shown) setTimeout(() => { if (SESSION === s && s.items[s.i] === it) playPattern(it.sound, $("#bigpat")); }, 250);
  if (shown && $("#nextbtn")) $("#nextbtn").focus({ preventScroll: true });
}
function answer(oi) {
  const s = SESSION, it = s.items[s.i];
  if (s.mode === "exam") { s.picks[s.i] = oi; s.confirm = false; viewQuiz(); return; }
  if (s.shown[s.i]) return;
  s.picks[s.i] = oi; s.shown[s.i] = true; const ok = oi === it.a;
  if (it.id) record(it.id, ok); else if (s.drill) { const r = S.drills[s.drill] || (S.drills[s.drill] = { c: 0, w: 0 }); ok ? r.c++ : r.w++; }
  haptic(ok ? "success" : "error"); save(); viewQuiz();
}
/* native iOS shell: haptic feedback (no-op in a browser) */
function haptic(kind) { try { window.webkit.messageHandlers.haptic.postMessage(kind); } catch (e) {} }
function finish() {
  const s = SESSION; stopSound();
  if (s.mode === "exam") s.items.forEach((it, k) => record(it.id, s.picks[k] === it.a));
  const correct = s.items.filter((it, k) => s.picks[k] === it.a).length;
  s.result = { correct, total: s.items.length, secs: Math.round((Date.now() - s.start) / 1000) };
  if (s.mode === "exam") { (S.exams[s.module] || (S.exams[s.module] = [])).push({ score: correct, date: Date.now() }); s.shown = s.shown.map(() => true); }
  save(); go("results");
}
function ring(p, ok) {
  const r = 54, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" style="stroke:${ok ? "var(--good)" : "var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 66 66)"/><text x="66" y="74" text-anchor="middle" font-family="Barlow Condensed, Avenir Next Condensed, sans-serif" font-size="30" font-weight="700">${Math.round(p * 100)}%</text></svg>`;
}
function viewResults() {
  const s = SESSION, R = s.result, exam = s.mode === "exam", M = exam ? MOD[s.module] : null, pass = exam ? R.correct >= M.pass : R.correct / R.total >= .7;
  const by = {}; s.items.forEach((it, k) => { const key = it.lesson || "other"; const b = by[key] || (by[key] = { c: 0, t: 0 }); b.t++; if (s.picks[k] === it.a) b.c++; });
  const missed = s.items.map((it, k) => ({ it, k })).filter(({ it, k }) => s.picks[k] !== it.a);
  const mins = Math.floor(R.secs / 60), secs = R.secs % 60;
  app.innerHTML = `<div class="quiz"><span class="eyebrow">${exam ? s.module + " mock exam" : "Session"} results</span>
  <div class="card score">${ring(R.correct / R.total, pass)}<div class="stack" style="gap:6px"><span class="verdict ${pass ? "pass" : "fail"}">${exam ? (pass ? "Passed" : "Not yet") : pass ? "Nice work" : "Keep at it"}</span><span class="mono" style="font-size:1.1rem">${R.correct} / ${R.total} correct${exam ? ` · pass mark ${M.pass}` : ""}</span><span class="muted">Time ${mins} min ${secs} s</span></div></div>
  ${Object.keys(by).length > 1 ? `<div class="card stack"><span class="eyebrow">By topic</span><div class="bars">${Object.entries(by).sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).map(([k, b]) => `<div class="bar-row"><a href="#lesson-${k}" style="color:inherit;text-decoration:none">${esc(LBYID[k] ? LBYID[k].title : "Other")}</a><div class="meter"><i style="width:${100 * b.c / b.t}%;background:${b.c / b.t >= .7 ? "var(--good)" : "var(--accent)"}"></i></div><span class="mono" style="text-align:right">${b.c}/${b.t}</span></div>`).join("")}</div></div>` : ""}
  <div class="row">${missed.length ? `<button class="btn primary" data-act="retry-missed">Retry ${missed.length} missed</button>` : ""}<button class="btn" data-act="again">${s.kind === "drill" ? "New set of 10" : "Practice again"}</button><a class="btn ghost" href="#home">Home</a></div>
  ${missed.length ? `<div class="card stack"><span class="eyebrow">Review what you missed</span><div class="missed">${missed.map(({ it, k }) => `<div class="item"><b>${it.id ? it.id + " · " : ""}${esc(it.q)}</b><span>Your answer: ${s.picks[k] === null ? "<i>none</i>" : esc(it.o[s.picks[k]])}</span><span style="color:var(--good);font-weight:600">Correct: ${esc(it.o[it.a])}</span><span class="muted">${esc(it.x)}</span></div>`).join("")}</div></div>` : ""}</div>`;
}

/* ---------- EVENTS ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, s = SESSION;
  if (a === "quick") startSession({ title: "Quick 10, mixed", mode: "practice", kind: "bank", items: shuffle(QUESTIONS).slice(0, 10) });
  else if (a === "missed") startSession({ title: "Missed questions", mode: "practice", kind: "bank", items: shuffle(missedIds()).map(id => QBYID[id]) });
  else if (a === "practice-mod") { PSET.mods = new Set([b.dataset.m]); PSET.lessons.clear(); go("practice"); }
  else if (a === "exam-mod") { const m = b.dataset.m; startSession({ title: `${m} · ${MOD[m].name}`, mode: "exam", kind: "bank", module: m, items: shuffle(QUESTIONS.filter(q => q.mod === m)) }); }
  else if (a === "resume") go("quiz");
  else if (a === "drill") startDrill(b.dataset.k);
  else if (a === "topic") startTopic(b.dataset.l);
  else if (a === "pm") { const m = b.dataset.m; PSET.mods.has(m) ? PSET.mods.delete(m) : PSET.mods.add(m); if (!PSET.mods.size) PSET.mods.add(m); viewPractice(); }
  else if (a === "pl") { const l = b.dataset.l; PSET.lessons.has(l) ? PSET.lessons.delete(l) : PSET.lessons.add(l); viewPractice(); }
  else if (a === "po") { PSET.only = b.dataset.k; viewPractice(); }
  else if (a === "pc") { PSET.count = +b.dataset.n; viewPractice(); }
  else if (a === "pstart") { const pool = shuffle(practicePool()); startSession({ title: "Practice set", mode: "practice", kind: "bank", items: PSET.count ? pool.slice(0, PSET.count) : pool }); }
  else if (!s) return;
  else if (a === "ans") answer(+b.dataset.oi);
  else if (a === "play") { const it = s.items[s.i]; if (it.sound) playPattern(it.sound, $("#bigpat")); }
  else if (a === "next") { if (s.mode === "practice" && s.i === s.items.length - 1) finish(); else { s.i = Math.min(s.items.length - 1, s.i + 1); viewQuiz(); window.scrollTo(0, 0); } }
  else if (a === "prev") { s.i = Math.max(0, s.i - 1); viewQuiz(); }
  else if (a === "goto") { s.i = +b.dataset.k; s.confirm = false; viewQuiz(); }
  else if (a === "flag") { s.flags[s.i] = !s.flags[s.i]; viewQuiz(); }
  else if (a === "submit") { s.confirm = true; viewQuiz(); }
  else if (a === "submit-no") { s.confirm = false; viewQuiz(); }
  else if (a === "submit-yes") finish();
  else if (a === "quit") { const n = s.shown.filter(Boolean).length; if (n) { s.items = s.items.slice(0, n); s.picks = s.picks.slice(0, n); s.shown = s.shown.slice(0, n); finish(); } else go("home"); }
  else if (a === "retry-missed") { const items = s.items.filter((it, k) => s.picks[k] !== it.a).map(({ order, ...rest }) => rest); startSession({ title: "Retry missed", mode: "practice", kind: s.kind, drill: s.drill, items }); }
  else if (a === "again") { if (s.kind === "drill") startDrill(s.drill); else if (s.mode === "exam") startSession({ title: s.title, mode: "exam", kind: "bank", module: s.module, items: shuffle(QUESTIONS.filter(q => q.mod === s.module)) }); else startSession({ title: s.title, mode: "practice", kind: s.kind, items: shuffle(s.items.map(({ order, ...rest }) => rest)) }); }
});
document.addEventListener("keydown", e => {
  if (route() !== "quiz" || !SESSION || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest("input,textarea,select")) return;
  const s = SESSION, it = s.items[s.i], k = e.key.toLowerCase(), idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (idx >= 0 && !s.shown[s.i]) { answer(it.order[idx]); e.preventDefault(); }
  else if (k === "enter" && (s.shown[s.i] || s.mode === "exam") && !e.target.closest("button")) { const n = $('[data-act="next"]'); if (n) n.click(); }
  else if (k === "arrowright" && s.mode === "exam" && s.i < s.items.length - 1) { s.i++; viewQuiz(); }
  else if (k === "arrowleft" && s.mode === "exam" && s.i > 0) { s.i--; viewQuiz(); }
});
render();
</script>
</body></html>
